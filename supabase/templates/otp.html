<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 440px; margin: 0 auto; padding: 32px 24px; color: #18181b;">
  <p style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #71717a; margin: 0 0 8px;">Filipino Fill</p>
  <h1 style="font-size: 22px; letter-spacing: -0.01em; margin: 0 0 16px;">Your verification code</h1>
  <p style="font-size: 15px; line-height: 1.6; margin: 0 0 24px;">Enter this code in the app to verify <strong>{{ .Email }}</strong>. It expires in one hour.</p>
  <p style="font-size: 32px; font-weight: 600; letter-spacing: 0.3em; background: #f4f4f5; border-radius: 12px; padding: 16px; text-align: center; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #71717a; margin: 0;">If you didn't request this, you can safely ignore this email.</p>
</div>
